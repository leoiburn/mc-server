# ============================================================================
#  Modded Minecraft (Java) server — portable, backed up, password-gated.
#  Runs on ANY Linux box with Docker: `git clone` this repo, make a .env,
#  then `docker compose up -d`.
#
#  Two services:
#    mc      -> the game server (Fabric + mods) using itzg/minecraft-server
#    backup  -> automatic world backups every few hours using itzg/mc-backup
# ============================================================================

services:
  mc:
    image: itzg/minecraft-server:java21   # Java 21 covers modern MC (1.20.5+)
    container_name: mc
    tty: true            # keep a console attached (needed for `docker attach mc`)
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565"    # the Minecraft port. host:container
    environment:
      # ---- required ----
      EULA: "TRUE"                     # you accept https://aka.ms/MinecraftEULA
      TYPE: "FABRIC"                   # mod loader. FABRIC=light/fast, or FORGE/NEOFORGE
      VERSION: "${MC_VERSION:-1.21.1}" # pin a version many mods support

      # ---- power / performance ----
      MEMORY: "${MC_MEMORY:-6G}"       # RAM for the JVM. See README to size this.
      USE_AIKAR_FLAGS: "TRUE"          # battle-tested garbage-collector tuning

      # ---- mods ("many mods") ----
      # EASIEST for a big pack: point at a Modrinth modpack (.mrpack) URL.
      MODRINTH_MODPACK: "${MODPACK_URL:-}"
      # OR hand-pick mods (slugs from modrinth.com). itzg resolves dependencies.
      # Leave MODPACK_URL empty to use this list instead:
      MODRINTH_PROJECTS: |
        fabric-api
        fabric-language-kotlin
        easyauth
        luckperms
        lithium
        ferrite-core
        spark
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"

      # ---- access + password gate ----
      # ONLINE_MODE FALSE = anyone can connect (no Mojang account check),
      # then the EasyAuth mod forces each player to /register a password.
      ONLINE_MODE: "${ONLINE_MODE:-FALSE}"
      OPS: "${OPS_USERS:-}"            # comma-separated admin usernames

      # ---- remote control (RCON) — used by the backup service ----
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"

      # ---- gameplay ----
      MOTD: "${MOTD:-Modded survival — /register <pass> <pass> to play}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-10}"
      TZ: "${TZ:-America/Mexico_City}"
    volumes:
      - ./data:/data                  # the whole world + config lives here
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 5m
      interval: 30s
      retries: 10

  backup:
    image: itzg/mc-backup
    container_name: mc-backup
    depends_on:
      mc:
        condition: service_healthy
    restart: unless-stopped
    environment:
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-2h}"  # how often to snapshot
      PRUNE_BACKUPS_DAYS: "${PRUNE_DAYS:-7}"     # delete snapshots older than this
      BACKUP_METHOD: "tar"                        # simple .tgz files in ./backups
      # It talks to the server over RCON to `save-off` before copying (safe backups):
      RCON_HOST: "mc"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      TZ: "${TZ:-America/Mexico_City}"
    volumes:
      - ./data:/data:ro               # read-only: backups can't corrupt the world
      - ./backups:/backups
